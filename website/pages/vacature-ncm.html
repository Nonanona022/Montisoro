<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vacature NCM | Montisoro</title>
  <meta name="description" content="Bekijk de vacature voor NCM bij Montisoro.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://montisoro.com/vacature-ncm">
  <link rel="stylesheet" href="/stylesheets/fonts.css">
  <style>
    :root {
      --paper: #f9f8f6;
      --ink: #17110f;
      --muted: #736b67;
      --orange: #e8592b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--paper);
    }

    .loader-card {
      display: flex;
      width: min(360px, 100%);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .loader-logo {
      width: 138px;
      height: auto;
      margin-bottom: 34px;
    }

    .loader-title {
      margin: 0 0 9px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(24px, 4vw, 31px);
      font-weight: 700;
      line-height: 1.15;
    }

    .loader-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .progress {
      position: relative;
      width: 164px;
      height: 2px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 17, 15, 0.12);
    }

    .progress-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: inherit;
      background: var(--orange);
      transition: width 160ms ease;
    }

    .progress.is-indeterminate .progress-bar {
      left: -45%;
      width: 45%;
      animation: loading 1.15s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    .direct-link {
      margin-top: 24px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      text-underline-offset: 3px;
    }

    @keyframes loading {
      from { transform: translateX(0); }
      to { transform: translateX(325%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar { transition: none; }
      .progress.is-indeterminate .progress-bar { animation-duration: 2.4s; }
    }
  </style>
</head>
<body aria-busy="true">
  <main>
    <section class="loader" aria-live="polite" aria-label="Document wordt geladen">
      <div class="loader-card">
        <img
          class="loader-logo"
          src="/assets/montisoro-logo-dark.png"
          width="617"
          height="456"
          alt="Montisoro"
        >
        <h1 id="loader-title" class="loader-title">Vacature wordt geladen</h1>
        <p id="loader-copy" class="loader-copy">Een ogenblik, het volledige document wordt klaargezet.</p>
        <div id="progress" class="progress is-indeterminate" role="progressbar" aria-label="Document laden">
          <span id="progress-bar" class="progress-bar"></span>
        </div>
        <a class="direct-link" href="/vacature-ncm.pdf">PDF rechtstreeks openen</a>
      </div>
    </section>
  </main>

  <noscript>
    <style>.progress { display: none; }</style>
  </noscript>

  <script>
    (function () {
      var pdfUrl = "/vacature-ncm.pdf";
      var progress = document.getElementById("progress");
      var progressBar = document.getElementById("progress-bar");
      var title = document.getElementById("loader-title");
      var copy = document.getElementById("loader-copy");

      function openPdf() {
        progress.classList.remove("is-indeterminate");
        progressBar.style.width = "100%";
        window.setTimeout(function () {
          window.location.replace(pdfUrl);
        }, 140);
      }

      fetch(pdfUrl, { cache: "force-cache", credentials: "same-origin" })
        .then(function (response) {
          if (!response.ok) throw new Error("PDF kon niet worden geladen");

          var total = Number(response.headers.get("content-length")) || 0;
          if (!response.body || !response.body.getReader) {
            return response.blob().then(openPdf);
          }

          var loaded = 0;
          var reader = response.body.getReader();
          if (total) progress.classList.remove("is-indeterminate");

          function read() {
            return reader.read().then(function (result) {
              if (result.done) {
                openPdf();
                return;
              }

              loaded += result.value.byteLength;
              if (total) {
                var percentage = Math.min(99, Math.round((loaded / total) * 100));
                progressBar.style.width = percentage + "%";
                progress.setAttribute("aria-valuenow", String(percentage));
              }
              return read();
            });
          }

          return read();
        })
        .catch(function () {
          title.textContent = "Document kon niet automatisch openen";
          copy.textContent = "Gebruik de link hieronder om de PDF rechtstreeks te openen.";
          progress.hidden = true;
          document.body.setAttribute("aria-busy", "false");
        });
    }());
  </script>
</body>
</html>
